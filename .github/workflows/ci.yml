name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: SDK qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: bindgen-${{ runner.os }}-0.2.128-rust-1.96
      - run: bun install --frozen-lockfile
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Install PDF reader and pinned native reference
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl --fail --location --retry 3 https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz --output /tmp/typst-native.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst-native.tar.xz' | sha256sum --check
          tar -xJf /tmp/typst-native.tar.xz -C /tmp
      - run: bun run check
      - run: bun run test:corpus:native
        env:
          TYPST_NATIVE_BIN: /tmp/typst-x86_64-unknown-linux-musl/typst
      - run: bun run benchmark
      - run: bun run build:memory-profiles
      - run: bun run benchmark:memory
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: qualification-${{ github.sha }}
          path: |
            report/
            dist/build.json
