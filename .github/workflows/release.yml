name: Publish qualified release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Check workflow run ID
        type: string
        required: true
      tag:
        description: Existing immutable version tag, such as v0.2.0
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Publish exact qualified package without rebuilding or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-release.mjs
