[package]
name = "wasmtypst"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "A single-world Typst compiler and language SDK for browsers and Node"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = "=0.15.1"
typst-ide = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
typst-layout = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typstyle-core = "=0.15.2"
comemo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.128"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0
